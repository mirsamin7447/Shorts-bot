# Save this file in your repo at: .github/workflows/post.yml
name: make-short

on:
  schedule:
    - cron: "30 2 * * *"   # 8:00 am IST
    - cron: "30 11 * * *"  # 5:00 pm IST
    - cron: "0 14 * * *"   # 7:30 pm IST
  workflow_dispatch:        # lets you press "Run workflow" to test
    inputs:
      script_file:
        description: "Optional script file in the repo, e.g. earth_facts.json (leave empty for auto)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Kokoro voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-hf-${{ runner.os }}-v1

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Make one Short
        run: |
          for i in 1 2 3; do
            python main.py && exit 0
            echo "Attempt $i failed, waiting 60 seconds"
            sleep 60
          done
          exit 1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SCRIPT_FILE: ${{ github.event.inputs.script_file }}

      - name: Publish as a Release (hosts the video file)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: short-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          for i in 1 2 3; do
            if gh release create "$TAG" out/short.mp4 \
                --title "$(cat out/title.txt)" --notes-file out/notes.txt; then
              exit 0
            fi
            echo "Release attempt $i failed, waiting 30 seconds"
            sleep 30
          done
          exit 1

      - name: Tell Make.com to upload it to YouTube
        env:
          HOOK: ${{ secrets.MAKE_WEBHOOK_URL }}
          TAG: short-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          if [ -z "$HOOK" ]; then echo "No MAKE_WEBHOOK_URL set, skipping upload"; exit 0; fi
          jq -n \
            --arg url "https://github.com/${{ github.repository }}/releases/download/$TAG/short.mp4" \
            --rawfile title out/title.txt \
            --rawfile description out/description.txt \
            '{url: $url, title: $title, description: $description}' \
          | curl -fsS -X POST -H "Content-Type: application/json" -d @- "$HOOK"

      - name: Save topic history
        run: |
          git config user.name "shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "update history" && git push)
